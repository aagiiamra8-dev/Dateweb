name: Fix desktop date picker
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix desktop date picker applied') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch date picker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old=".picker{position:absolute;inset:0;width:100%;height:100%;opacity:.01;cursor:pointer;z-index:4;"
          if old in s and 'pointer-events:none' not in s[s.find(old):s.find(old)+400]:
              s=s.replace(old, old+'pointer-events:none;', 1)
          marker='</script>'
          patch="""\n<script>\n(function(){\n  const box=document.getElementById('datetimeBox');\n  const picker=document.getElementById('datePicker');\n  if(!box||!picker)return;\n  box.addEventListener('click',function(){\n    try{\n      if(typeof picker.showPicker==='function') picker.showPicker();\n      else picker.click();\n    }catch(e){picker.click();}\n  });\n})();\n</script>\n"""
          if 'typeof picker.showPicker' not in s:
              s=s.replace(marker, patch+marker, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix desktop date picker applied'
          git push