name: Fix desktop date picker
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'Fix date picker click target applied') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch date picker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.find('.picker{')
          if start >= 0:
              end=s.find('}', start)
              css=s[start:end+1]
              css=css.replace('pointer-events:none;','pointer-events:auto;')
              css=css.replace('appearance:none;','').replace('-webkit-appearance:none;','')
              s=s[:start]+css+s[end+1:]
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'Fix date picker click target applied'
          git push