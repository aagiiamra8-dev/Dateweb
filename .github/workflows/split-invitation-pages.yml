name: Split invitation into real pages
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  split:
    if: ${{ !contains(github.event.head_commit.message, 'Real separate invitation pages applied') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create separate date page and question page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          start=s.find('<div id="inviteStep"')
          end=s.find('</div><div class="footer">', start)
          if start < 0 or end < 0:
              raise SystemExit('inviteStep block not found')
          invite=s[start:end+6]
          # Build a standalone date page from the existing invite UI.
          style=s[s.find('<style>'):s.find('</style>')+8]
          scripts=s[s.find('<script>'):s.find('</script>')+9]
          # Extract the existing form and invitation content, then add a standalone script.
          date_page='''<!doctype html><html lang="mn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Болзооны урилга ♡</title>'''+style+'''</head><body><main class="card show" id="card">'''+invite+'''<div class="footer">MADE WITH A LITTLE COURAGE & LOTS OF LOVE</div></main><div class="success-modal" id="successModal"><div class="success-box"><div class="success-heart">♡</div><h2>Тэгвэл болзъё. ♡</h2><div class="dress">Dress code</div><div class="dress-text">Өөртөө хамгийн гоё санагдсан хувцсаа өмсөөрэй.<br>Бусдыг нь би зохицуулна. ✨</div><button class="modal-close" id="modalClose">За ♡</button></div></div><div class="celebrate" id="celebrate"></div>'''+scripts+'''</body></html>'''
          Path('date.html').write_text(date_page)
          # Remove the date form/page from index and make YES navigate to date.html.
          question=s[:start] + s[end+6:]
          old="document.getElementById('yes').onclick=()=>{questionStep.classList.add('leaving');setTimeout(()=>{questionStep.classList.remove('active','leaving');questionStep.classList.add('hidden');inviteStep.classList.remove('hidden');inviteStep.classList.add('entering','active');requestAnimationFrame(()=>requestAnimationFrame(()=>inviteStep.classList.remove('entering')))},350)};"
          if old in question:
              question=question.replace(old,"document.getElementById('yes').onclick=()=>{window.location.href='date.html'};",1)
          # Remove now-unused inviteStep references if present in JS.
          question=question.replace("const questionStep=document.getElementById('questionStep'),inviteStep=document.getElementById('inviteStep'),confirm=document.getElementById('confirm');","const questionStep=document.getElementById('questionStep'),confirm=document.getElementById('confirm');")
          p.write_text(question)
          PY
      - name: Commit changes and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/split-invitation-pages.yml
          git add index.html date.html .github/workflows/split-invitation-pages.yml
          git diff --cached --quiet || git commit -m 'Real separate invitation pages applied'
          git push
