<!doctype html><html lang="mn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Болзоогоо сонгоё ♡</title><style>body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f8e7e9;font-family:Arial,sans-serif;color:#46383a;overflow:hidden}.card{width:min(560px,calc(100% - 28px));padding:30px 24px 26px;background:#fffdfd;border-radius:30px;text-align:center;box-shadow:0 20px 60px #75464f22;max-height:calc(100svh - 28px);overflow:hidden}.eyebrow{font-size:11px;letter-spacing:1.8px;color:#b97984}.heart{margin:10px auto;width:50px;height:50px;border-radius:50%;background:#75464f;color:white;display:grid;place-items:center;font-size:22px}.title{font-size:27px;font-weight:bold;color:#75464f;margin:6px}.sub{color:#9a7c80;margin:5px 0 13px;font-size:13px}.details{display:grid;gap:7px;max-width:440px;margin:0 auto}.detail{display:flex;align-items:center;gap:10px;text-align:left;padding:8px 11px;border:1px solid #75464f1a;border-radius:16px;background:#fff;min-height:50px}.icon{width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;border-radius:11px;background:#f5e0e3;color:#75464f;font-size:15px}.label{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:#b18f92;margin-bottom:2px}.select,.input,.textarea{width:100%;border:0;outline:0;background:transparent;font:14px Arial;color:#4b3b3d}.select{cursor:pointer}.textarea{resize:none;min-height:30px}.mainbtn{margin-top:12px;border:0;border-radius:999px;padding:12px 27px;background:#75464f;color:#fff;font-weight:bold;cursor:pointer}.success{display:none;position:fixed;inset:0;place-items:center;background:#75464f55;padding:20px;z-index:20}.success.show{display:grid}.box{background:#fff;border-radius:25px;padding:30px;text-align:center;max-width:380px;position:relative;z-index:2;animation:popupIn 1.1s cubic-bezier(.22,1,.36,1) both}.box h2{color:#75464f;animation:textIn 1.25s .2s ease both}.box p{animation:textIn 1.25s .42s ease both}.success-heart{font-size:42px;animation:heartIn 1s ease both,pulse 1.8s 1s ease-in-out infinite}.success-sparkle{font-size:24px;letter-spacing:8px;color:#b97984;animation:textIn 1.25s .58s ease both,sparkle 1.8s 1s ease-in-out infinite}.close{border:0;border-radius:999px;padding:11px 25px;background:#75464f;color:#fff;animation:textIn 1.25s .72s ease both}@keyframes popupIn{0%{opacity:0;transform:translateY(55px) scale(.78);filter:blur(7px)}55%{opacity:1;transform:translateY(-7px) scale(1.03);filter:blur(0)}80%{transform:translateY(3px) scale(.99)}100%{transform:translateY(0) scale(1)}}@keyframes textIn{0%{opacity:0;transform:translateY(18px)}100%{opacity:1;transform:translateY(0)}}@keyframes heartIn{0%{opacity:0;transform:scale(.25)}70%{opacity:1;transform:scale(1.2)}100%{transform:scale(1)}}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}.success .confetti{z-index:30}.piece{position:absolute;top:-30px;width:9px;height:16px;animation:fall 3.5s linear forwards;opacity:0}.heart-piece{position:absolute;top:-30px;font-size:20px;animation:fall 4s linear forwards;opacity:0}@keyframes fall{0%{transform:translate3d(0,-30px) rotate(0deg) scale(.7);opacity:1}100%{transform:translate3d(var(--drift),110vh) rotate(900deg) scale(1);opacity:0}}#finalPage{display:none;position:fixed;inset:0;z-index:40;place-items:center;text-align:center;background:linear-gradient(135deg,#f5dfe2,#fff8f3 48%,#f2dfe0);padding:24px;overflow:hidden}#finalPage:before,#finalPage:after{content:'♡ ✦ ✨ ♡ ✦';position:absolute;left:-20%;width:140%;font-size:28px;letter-spacing:55px;opacity:.22;animation:floatAcross 9s linear infinite}#finalPage:after{top:70%;animation-duration:12s;animation-direction:reverse;font-size:22px}@keyframes floatAcross{from{transform:translateX(-10%) translateY(0) rotate(-3deg)}to{transform:translateX(10%) translateY(-35px) rotate(3deg)}}.final-content{position:relative;z-index:2;animation:finalIn 1.2s ease both}.final-heart{font-size:68px;animation:pulse 1.8s ease-in-out infinite}.final-title{font:600 36px Georgia,serif;color:#75464f;margin:15px 0 12px;animation:softFloat 3s ease-in-out infinite}.final-sparkle{margin-top:22px;font-size:25px;letter-spacing:12px;animation:sparkle 2s ease-in-out infinite}@keyframes finalIn{from{opacity:0;transform:translateY(35px) scale(.94)}to{opacity:1;transform:none}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}@keyframes softFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes sparkle{0%,100%{opacity:.45;transform:scale(.95)}50%{opacity:1;transform:scale(1.08)}}@media(max-width:480px){.card{width:calc(100% - 20px);padding:22px 15px 18px;border-radius:25px}.eyebrow{font-size:9px;letter-spacing:1.5px}.heart{width:42px;height:42px;margin:7px auto;font-size:19px}.title{font-size:22px;margin:4px}.sub{font-size:11px;margin:3px 0 9px}.details{gap:5px}.detail{min-height:43px;padding:6px 8px;border-radius:13px;gap:8px}.icon{width:28px;height:28px;flex-basis:28px;border-radius:9px;font-size:13px}.label{font-size:7px;letter-spacing:.8px}.select,.input,.textarea{font-size:12px}.textarea{min-height:25px}.mainbtn{margin-top:8px;padding:10px 23px;font-size:13px}}@media(max-height:700px){.card{padding-top:16px;padding-bottom:14px}.heart{margin:5px auto;width:38px;height:38px}.details{gap:4px}.detail{min-height:39px;padding:5px 8px}.icon{width:26px;height:26px;flex-basis:26px}.mainbtn{margin-top:6px;padding:9px 22px}}</style></head><body><script>if(sessionStorage.getItem('dateInvitationEntry')!=='1'){location.replace('index.html')}else{sessionStorage.removeItem('dateInvitationEntry')}</script><main class="card"><div class="eyebrow">♡ A LITTLE INVITATION ♡</div><div class="heart">♡</div><div class="title">Болзоогоо хамт сонгоё</div><p class="sub">Чамд тохирох өдрөө, цагаа сонгоорой. ✨</p><section class="details"><div class="detail"><div class="icon">♡</div><div style="width:100%"><div class="label">Огноо</div><select class="select" id="datePicker"><option value="">Огноо сонгох</option></select></div></div><div class="detail"><div class="icon">🕐</div><div style="width:100%"><div class="label">Цаг</div><select class="select" id="time"><option value="">Цаг сонгох</option><option>06:00</option><option>07:00</option><option>08:00</option><option>09:00</option><option>10:00</option><option>11:00</option><option>12:00</option><option>13:00</option><option>14:00</option><option>15:00</option><option>16:00</option><option>17:00</option><option>18:00</option><option>19:00</option><option>20:00</option><option>21:00</option><option>22:00</option><option>23:00</option></select></div></div><div class="detail"><div class="icon">✦</div><div style="width:100%"><div class="label">Юу хийх вэ?</div><select class="select" id="activity"><option>🍷 Dinner date</option><option>🎬 Movie night</option><option>☕ Coffee date</option><option>🌙 Night walk</option><option>🧺 Picnic date</option><option>🥾 Hiking date</option><option>🐎 Horseback riding</option><option>🎨 Art date</option><option>🎳 Fun activity</option><option>✨ Surprise date</option></select></div></div><div class="detail"><div class="icon">📍</div><div style="width:100%"><div class="label">Уулзах цэг</div><input class="input" id="location" placeholder="Жишээ: 1-р хорооллын Burger King"></div></div><div class="detail"><div class="icon">♡</div><div style="width:100%"><div class="label">Анхаарах зүйлс</div><textarea class="textarea" id="notes" rows="2" placeholder="Нэмэлтээр хэлэх зүйл байвал энд бичээрэй..."></textarea></div></div></section><button class="mainbtn" id="submit">Би зөвшөөрч байна ♡</button></main><div class="success" id="success"><div class="confetti" id="confetti"></div><div class="box"><div class="success-heart">♡</div><h2>Удахгүй уулзъя. ♡</h2><p>Өөртөө хамгийн гоё санагдсан хувцсаа өмсөөрэй.<br>Бусдыг нь би зохицуулна. ✨</p><div class="success-sparkle">✦ ✧ ✨ ✧ ✦</div><button class="close" id="done">За ♡</button></div></div><div id="finalPage"><div class="final-content"><div class="final-heart">♡</div><h1 class="final-title">Өдрийг сайхан өнгөрүүлээрэй ♡</h1><div class="final-sparkle">✦ ✧ ✨ ✧ ✦</div></div><div class="confetti" id="finalConfetti"></div></div><script>const datePicker=document.getElementById('datePicker');const today=new Date();today.setHours(0,0,0,0);const end=new Date(2026,11,31);const months=['1-р сар','2-р сар','3-р сар','4-р сар','5-р сар','6-р сар','7-р сар','8-р сар','9-р сар','10-р сар','11-р сар','12-р сар'];for(let d=new Date(today);d<=end;d.setDate(d.getDate()+1)){const value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const option=document.createElement('option');option.value=value;option.textContent=`${d.getFullYear()} оны ${months[d.getMonth()]} ${d.getDate()}`;datePicker.appendChild(option)}function confetti(target,count=220,duration=5000){target.innerHTML='';const symbols=['♥','✦','✧','♡','✨'];for(let i=0;i<count;i++){const el=document.createElement('span');const isHeart=i%4===0;el.className=isHeart?'heart-piece':'piece';el.textContent=isHeart?symbols[Math.floor(Math.random()*symbols.length)]:'';if(!isHeart)el.style.background=['#75464f','#d99aa5','#f1c6a8','#d8b3bd','#f6d36b'][Math.floor(Math.random()*5)];el.style.left=Math.random()*100+'%';el.style.setProperty('--drift',(Math.random()*220-110)+'px');el.style.animationDuration=(3+Math.random()*1.7)+'s';el.style.animationDelay=Math.random()*0.7+'s';target.appendChild(el)}setTimeout(()=>target.innerHTML='',duration)}document.getElementById('submit').onclick=()=>{const time=document.getElementById('time').value;if(!datePicker.value||!time){alert('Огноо болон цагаа сонгоно уу ♡');return}const d=new Date(datePicker.value+'T00:00:00');const formatted=d.toLocaleDateString('mn-MN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}),activity=document.getElementById('activity').value,location=document.getElementById('location').value||'Бичээгүй',notes=document.getElementById('notes').value||'Бичээгүй';const data=new URLSearchParams({date:formatted,time,activity,location,notes,reply:'Би зөвшөөрч байна ♡'});const btn=document.getElementById('submit');btn.disabled=true;btn.textContent='Илгээж байна...';fetch('https://script.google.com/macros/s/AKfycby7qGFgiXTk9t9EsnRKY1QBfhLIuVEKsFNfnukP0nrTkY9bnqUB0_T72xHSuz1MH2Gz4w/exec',{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:data.toString()}).catch(()=>{});document.getElementById('success').classList.add('show');confetti(document.getElementById('confetti'),220,5000);btn.style.display='none'};document.getElementById('done').onclick=()=>{document.getElementById('success').classList.remove('show');document.getElementById('confetti').innerHTML='';document.getElementById('finalPage').style.display='grid';confetti(document.getElementById('finalConfetti'),150,10000)};</script></body></html>
