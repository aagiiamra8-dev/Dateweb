<textarea class="textarea" id="notes" rows="2" placeholder="Нэмэлтээр хэлэх зүйл байвал энд бичээрэй..."></textarea></div></div></section><button class="mainbtn" id="submit">Би зөвшөөрч байна ♡</button></main><div class="success" id="success"><div class="box"><div class="big">♡</div><h2>Удахгүй уулзъя. ♡</h2><div class="dress">Dress code</div><div class="dress-text">Өөртөө хамгийн гоё санагдсан хувцсаа өмсөөрэй.<br>Бусдыг нь би зохицуулна. ✨</div><button class="close" onclick="document.getElementById('success').classList.remove('show')">За ♡</button></div></div><script>const datePicker=document.getElementById('datePicker');datePicker.addEventListener('change',()=>{});document.getElementById('submit').onclick=async()=>{const time=document.getElementById('time').value;if(!datePicker.value||!time){alert('Огноо болон цагаа сонгоно уу ♡');return}const d=new Date(datePicker.value+'T00:00:00');const formatted=d.toLocaleDateString('mn-MN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}),activity=document.getElementById('activity').value,location=document.getElementById('location').value||'Бичээгүй',notes=document.getElementById('notes').value||'Бичээгүй';const data=new URLSearchParams({date:formatted,time,activity,location,notes,reply:'Би зөвшөөрч байна ♡'});const btn=document.getElementById('submit');btn.disabled=true;btn.textContent='Илгээж байна...';try{await fetch('https://script.google.com/macros/s/AKfycby7qGFgiXTk9t9EsnRKY1QBfhLIuVEKsFNfnukP0nrTkY9bnqUB0_T72xHSuz1MH2Gz4w/exec',{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:data.toString()});const form=new FormData();form.append('_subject','💌 Болзооны урилгын хариу');form.append('_captcha','false');form.append('_template','table');form.append('Хариу','Би зөвшөөрч байна ♡');form.append('Огноо',formatted);form.append('Цаг',time);form.append('Болзооны төрөл',activity);form.append('Уулзах цэг',location);form.append('Анхаарах зүйлс',notes);fetch('https://formsubmit.co/ajax/aagiiamra8@gmail.com',{method:'POST',body:form,headers:{Accept:'application/json'},keepalive:true}).catch(()=>{});document.getElementById('success').classList.add('show');btn.style.display='none'}catch(e){btn.disabled=false;btn.textContent='Би зөвшөөрч байна ♡';alert('Хариу илгээхэд алдаа гарлаа. Дахин оролдоно уу.')}};</script></body></html>
