<!doctype html><html lang="mn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Чамд зориулсан урилга ♡</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap');*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#f5dfe2,#fff8f3 48%,#f2dfe0);font-family:'DM Sans',sans-serif;color:#46383a}.screen{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#f4dfe2,#fff8f3,#f1dfe1);z-index:10;transition:.7s}.hide{opacity:0;visibility:hidden;pointer-events:none}.envelope{text-align:center;cursor:pointer}.env{position:relative;width:300px;height:205px;margin:auto;filter:drop-shadow(0 24px 32px #75505a33)}.body{position:absolute;inset:0;border-radius:12px;background:#fff8f5;border:1px solid #75505a1a}.flap{position:absolute;z-index:2;left:0;top:0;border-left:150px solid transparent;border-right:150px solid transparent;border-top:108px solid #ecd0d4;transform-origin:top;transition:.9s}.open .flap{transform:rotateX(180deg)}.seal{position:absolute;z-index:4;left:50%;top:53%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:linear-gradient(145deg,#8d5962,#6f414a);color:#fff;display:grid;place-items:center;font-size:23px}.open .seal{opacity:0}.small{font-size:13px;letter-spacing:2.2px;text-transform:uppercase;color:#ae858a;margin-bottom:18px}.title{margin-top:26px;font:600 32px 'Playfair Display',serif;color:#75464f}.tap{font-size:19px;color:#a88b8f;margin-top:10px}.card{width:min(560px,calc(100% - 28px));padding:48px 30px 40px;border-radius:34px;background:#fffdfadd;box-shadow:0 28px 80px #5b34391f;text-align:center;opacity:0;transform:translateY(20px);transition:.7s}.card.show{opacity:1;transform:none}.eyebrow{font-size:13px;letter-spacing:2.2px;text-transform:uppercase;color:#b97984}.heart{margin:30px auto;width:66px;height:66px;border-radius:50%;background:linear-gradient(145deg,#9a626b,#71434c);color:#fff;display:grid;place-items:center;font-size:27px}.question{font:24px/1.5 'Playfair Display',serif;color:#75464f;margin:25px auto}.buttons{display:flex;justify-content:center;gap:12px}.btn{min-width:125px;padding:14px 24px;border:0;border-radius:999px;font-weight:600;cursor:pointer}.yes{background:#75464f;color:#fff}.no{background:#fff1f1;color:#75464f;border:1px solid #b9798426}.notice{display:none;position:fixed;inset:0;z-index:30;background:#75464f45;backdrop-filter:blur(7px);place-items:center;padding:20px}.notice.show{display:grid}.box{width:min(410px,100%);background:#fffaf8;border-radius:28px;padding:34px 28px;text-align:center;box-shadow:0 25px 70px #4b303040}.box h2{font:600 24px/1.45 'Playfair Display',serif;color:#75464f;margin:0 0 22px}.box button{border:0;border-radius:999px;padding:12px 28px;background:#75464f;color:#fff;font-weight:600;cursor:pointer}@media(max-width:480px){.env{width:280px;height:192px}.flap{border-left-width:140px;border-right-width:140px;border-top-width:101px}.title{font-size:29px}.card{padding:40px 20px 34px}.question{font-size:21px}}</style></head><body><div class="screen" id="envelopeScreen"><div class="envelope" id="envelopeArea"><div class="small">A little surprise for you</div><div class="env" id="envelope"><div class="body"></div><div class="flap"></div><div class="seal">♡</div></div><div class="title">Чамд зориулсан урилга ♡</div><div class="tap">Нээгээд үзээрэй</div></div></div><main class="card" id="questionCard"><div class="eyebrow">♡ A LITTLE QUESTION ♡</div><div class="heart">♡</div><div class="question">Чамайг болзоонд уримаар байна.<br><b>Надтай болзох уу?</b></div><div class="buttons"><button class="btn yes" id="yes">Тийм ♡</button><button class="btn no" id="no">Үгүй</button></div></main><div class="notice" id="notice"><div class="box"><h2>Та уг үйлдлийг хийх эрхгүй байна.<br>Дахин бодож үзнэ үү. ♡</h2><button id="noticeOk">Ойлголоо ♡</button></div></div><script>const env=document.getElementById('envelope'),screen=document.getElementById('envelopeScreen'),card=document.getElementById('questionCard');document.getElementById('envelopeArea').onclick=()=>{if(env.classList.contains('open'))return;env.classList.add('open');setTimeout(()=>{screen.classList.add('hide');card.classList.add('show')},850)};const notice=document.getElementById('notice');document.getElementById('no').onclick=()=>notice.classList.add('show');document.getElementById('noticeOk').onclick=()=>notice.classList.remove('show');document.getElementById('yes').onclick=()=>{sessionStorage.setItem('dateInvitationEntry','1');window.location.href='date.html'};</script></body></html>
